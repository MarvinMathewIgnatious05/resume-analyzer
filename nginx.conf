user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Rate Limiting configuration
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    # Security Headers (OWASP Compliance)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'none';" always;

    upstream django_backend {
        server web:8000;
    }

    upstream fastapi_service {
        server fastapi:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Redirect all HTTP requests to HTTPS (commented out for local development)
        # return 301 https://$host$request_uri;

        # Frontend assets
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            expires 1d;
            add_header Cache-Control "public, no-transform";
        }

        # Django Core API
        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://django_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            client_max_body_size 5M;
        }

        # Django Static & Media files
        location /static/ {
            alias /app/staticfiles/;
            expires 7d;
        }

        location /media/ {
            alias /app/media/;
            expires 7d;
        }

        # FastAPI microservice direct endpoint (for administrative debug)
        location /fastapi/ {
            limit_req zone=api_limit burst=5 nodelay;
            rewrite ^/fastapi/(.*)$ /$1 break;
            proxy_pass http://fastapi_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
