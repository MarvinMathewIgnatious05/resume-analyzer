apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resume-analyzer-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "5m"
    nginx.ingress.kubernetes.io/limit-rps: "20"
spec:
  rules:
    - host: resumeanalyzer.local
      http:
        paths:
          # React Frontend SPA
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
                  
          # Django Core API
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: django-backend
                port:
                  number: 8000
