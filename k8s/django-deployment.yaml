apiVersion: v1
kind: Service
metadata:
  name: django-backend
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: django-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: django-backend
  template:
    metadata:
      labels:
        app: django-backend
    spec:
      containers:
        - name: django
          image: resume-analyzer-web:latest
          command: ["gunicorn", "resume_analyzer.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3"]
          ports:
            - containerPort: 8000
          env:
            - name: DB_NAME
              value: resume_analyzer
            - name: DB_USER
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: resume-analyzer-secrets
                  key: database-password
            - name: DB_HOST
              value: postgres-db
            - name: DB_PORT
              value: "5432"
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: FASTAPI_SERVICE_URL
              value: http://fastapi-service:8080
            - name: DEBUG
              value: "False"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: resume-analyzer-secrets
                  key: secret-key
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: django-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: django-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
